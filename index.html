<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pauta Arena CP</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Aplica o tema antes da pintura para evitar flash
    try {
      var t = localStorage.getItem('pauta-arena-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="brand-logo" id="brandLogo" aria-hidden="true"></div>
        <div>
          <h1>Pauta diária</h1>
          <p class="meta" id="meta"></p>
        </div>
      </div>
      <div class="actions">
        <span id="saved" class="saved" aria-live="polite"></span>
        <div class="menu">
          <button id="exportBtn" class="btn primary" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span>Exportar</span>
          </button>
          <div class="menu-pop" id="exportMenu" hidden>
            <p class="menu-label">Texto</p>
            <button data-export="md">Markdown — pauta completa</button>
            <p class="menu-label">Imagem da pauta</p>
            <button data-export="img">Imagem única</button>
            <button data-export="wa">Em partes — 1080×1350 (Instagram/WhatsApp)</button>
          </div>
        </div>
        <div class="menu">
          <button id="moreBtn" class="icon-btn" aria-label="Mais opções" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </button>
          <div class="menu-pop" id="moreMenu" hidden>
            <button data-more="folder">Escolher pasta das imagens</button>
            <button data-more="backup">Salvar backup (.json)</button>
            <button data-more="import">Importar backup</button>
            <button data-more="reset" class="danger">Restaurar pauta original</button>
          </div>
        </div>
        <button id="themeBtn" class="icon-btn" aria-label="Alternar tema claro/escuro">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </div>
    <nav class="wrap tabs" role="tablist">
      <button role="tab" data-tab="pauta">Pauta</button>
      <button role="tab" data-tab="prestacao">Prestação</button>
      <button role="tab" data-tab="boneco">Boneco</button>
      <button role="tab" data-tab="perguntas">Perguntas do programa</button>
    </nav>
  </header>

  <main class="wrap">
    <section id="panel-pauta" class="panel" role="tabpanel"></section>
    <section id="panel-prestacao" class="panel" role="tabpanel" hidden></section>
    <section id="panel-boneco" class="panel" role="tabpanel" hidden></section>
    <section id="panel-perguntas" class="panel" role="tabpanel" hidden></section>
  </main>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="logos.js"></script>
  <script src="app.js"></script>
</body>
</html>
